# ZMK Configuration for Wired Keyboard - Right Side (Peripheral)

# Display - DISABLED (no display hardware)
CONFIG_ZMK_DISPLAY=n

# Bluetooth settings - DISABLED for wired 
CONFIG_ZMK_BLE=n

# Mouse support (new ZMK pointing system)
CONFIG_ZMK_POINTING=y

# USB logging (enable for debugging, disable for production)
# CONFIG_ZMK_USB_LOGGING=y

# Debounce settings
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# USB settings 
CONFIG_ZMK_USB=y

# Split keyboard settings - RIGHT side as peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n