# ZMK Configuration for Wired Keyboard - No Display

# Display - DISABLED (no display hardware)
CONFIG_ZMK_DISPLAY=n

# Bluetooth settings - DISABLED for wired 
CONFIG_ZMK_BLE=n

# Power management - DISABLED for USB-powered wired keyboard
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# CONFIG_ZMK_PM_SOFT_OFF=y

# Mouse support (new ZMK pointing system)
CONFIG_ZMK_POINTING=y

# Combo settings (auto-calculated from devicetree)
# CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
# CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# USB logging (enable for debugging, disable for production)
# CONFIG_ZMK_USB_LOGGING=y

# Debounce settings
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Studio support (disabled - causes build issues without proper UART setup)
# CONFIG_ZMK_STUDIO=y

# USB settings 
CONFIG_ZMK_USB=y

# Split keyboard settings - LEFT side as parent
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y